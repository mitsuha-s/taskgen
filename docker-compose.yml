services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teacher_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d teacher_assistant"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://app:app@postgres:5432/teacher_assistant?sslmode=disable
      AUTH_EMAIL: ${AUTH_EMAIL:-teacher@example.com}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-secret}
      FILE_STORAGE_DIR: /app/storage/uploads
      PUBLIC_FILE_BASE_URL: /api/files
      FRONTEND_DIST_DIR: /app/frontend/dist
      MIGRATIONS_DIR: /app/migrations
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-Pro}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-}
      GIGACHAT_API_BASE_URL: ${GIGACHAT_API_BASE_URL:-}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-}
      GIGACHAT_VERIFY_TLS: ${GIGACHAT_VERIFY_TLS:-}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-}
      GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-90}
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "${APP_PORT:-18080}:8080"
    volumes:
      - backend_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:

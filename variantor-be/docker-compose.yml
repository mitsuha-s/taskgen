services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: variantor
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d variantor"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://app:app@postgres:5432/variantor
      AUTH_EMAIL: ${AUTH_EMAIL:-teacher@example.com}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-secret}
      FILE_STORAGE_DIR: /app/storage/uploads
      PUBLIC_FILE_BASE_URL: /api/files
      MIGRATIONS_DIR: /app/migrations
      PROMPTS_DIR: /app/prompts/task_processing_pipeline_v1
      CORS_ALLOWED_ORIGIN: http://localhost:${APP_PORT:-18080},http://127.0.0.1:${APP_PORT:-18080},http://127.0.0.1:5173,http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - backend_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../variantor-fe
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
